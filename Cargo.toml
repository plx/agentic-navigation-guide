[package]
name = "agentic-navigation-guide"
version = "0.1.3"
edition = "2021"
authors = ["plx <plxgithub@gmail.com>"]
description = "A CLI tool for verifying hand-written navigation guides against filesystem structure"
license = "MIT"
repository = "https://github.com/plx/agentic-navigation-guide"
keywords = ["cli", "filesystem", "validation", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agentic-navigation-guide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.5"
globset = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.38"
