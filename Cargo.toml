[package]
name = "agentic-navigation-guide"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["plx <plxgithub@gmail.com>"]
description = "A CLI tool for verifying hand-written navigation guides against filesystem structure"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plx/agentic-navigation-guide"
documentation = "https://github.com/plx/agentic-navigation-guide/blob/main/docs/v0.2-contract.md"
keywords = ["cli", "filesystem", "validation", "documentation"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
# Root-anchored source-package boundary; #62 asserts the exact expanded list.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/LICENSING.md",
    "/NOTICE",
    "/README.md",
    "/THIRD_PARTY_LICENSES.md",
    "/docs/release-policy.md",
    "/docs/v0.2-contract.md",
    "/src/main.rs",
    "/src/cli/*.rs",
    "/src/dumper.rs",
    "/src/entry_type.rs",
    "/src/errors.rs",
    "/src/exclusion.rs",
    "/src/guide_input.rs",
    "/src/parser.rs",
    "/src/path_codec.rs",
    "/src/recursive.rs",
    "/src/types.rs",
    "/src/validator.rs",
    "/src/verifier.rs",
]

[[bin]]
name = "agentic-navigation-guide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
walkdir = "2.5"
globset = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
syn = { version = "2.0", features = ["full", "visit"] }
