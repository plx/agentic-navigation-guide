name: Repository protection audit

on:
  schedule:
  - cron: "31 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read # Inspect environment protection metadata.
  contents: read

concurrency:
  group: repository-protection-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit public repository protections
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Compare public GitHub configuration with reviewed policy
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        PYTHONDONTWRITEBYTECODE=1
        python3 scripts/audit_github_protections.py
        --output target/repository-protection-attestation.json
