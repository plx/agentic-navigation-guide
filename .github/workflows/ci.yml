name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to immutable commit SHAs (with the version
# tag in a trailing comment) so a compromised upstream tag cannot silently
# swap in malicious code. Bump SHAs intentionally when upgrading.
jobs:
  rust-support:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - rust: "1.85.0"
          msrv: true
          lint: true
        - rust: "1.96.1"
          msrv: false
          lint: false
        - rust: "1.97.1"
          msrv: false
          lint: true
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy
    - name: Check every target and feature
      run: cargo check --locked --all-targets --all-features
    - name: Test every target and feature
      run: cargo test --locked --all-targets --all-features
    - name: Lint supported endpoints
      if: matrix.lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Package on the MSRV
      if: matrix.msrv
      run: cargo package --locked
    - name: Install the packaged CLI on the MSRV
      if: matrix.msrv
      run: >-
        cargo install
        --path target/package/agentic-navigation-guide-0.2.0
        --locked
        --root "$RUNNER_TEMP/msrv-install"

  rust-beta:
    name: Rust beta (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: beta
    - name: Check the next Rust toolchain
      run: cargo check --locked --all-targets --all-features
    - name: Test the next Rust toolchain
      run: cargo test --locked --all-targets --all-features

  branch-coverage:
    name: Branch-aware coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: nightly-2025-11-04
        components: llvm-tools-preview
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: cargo-llvm-cov@0.8.7
    - name: Run all-target branch instrumentation from a clean state
      run: |
        cargo llvm-cov clean --workspace
        cargo llvm-cov \
          --locked --all-targets --all-features --branch --no-report
    - name: Generate branch-aware reports
      run: |
        mkdir -p target/issue-59-coverage
        cargo llvm-cov report --branch --json \
          --output-path target/issue-59-coverage/coverage.json
        cargo llvm-cov report --branch --lcov \
          --output-path target/issue-59-coverage/lcov.info
        cargo llvm-cov report --branch --html \
          --output-dir target/issue-59-coverage/html
    - name: Enforce overall and critical-module floors
      run: >-
        python3 scripts/check_coverage.py
        target/issue-59-coverage/coverage.json
    - name: Upload coverage evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: issue-59-branch-coverage
        path: target/issue-59-coverage
        if-no-files-found: error

  blocker-mutations:
    name: Original-blocker mutation sentinels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MUTATION_FILTER: "replace Parser::classify_marker_line ->|replace Parser::build_hierarchy ->|replace Dumper::dump ->|replace Validator::validate_syntax ->|replace Verifier::verify ->|replace VerificationRun.*::snapshot ->|replace VerificationAggregate::from_results ->|in VerificationAggregate::from_results|replace find_guides ->"
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: "1.97.1"
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: cargo-mutants@27.1.0
    - name: Run the deterministic reviewed mutation set
      run: |
        mkdir -p target/issue-59-mutants
        cargo mutants \
          --file src/parser.rs \
          --file src/dumper.rs \
          --file src/validator.rs \
          --file src/verifier.rs \
          --file src/recursive.rs \
          --re "$MUTATION_FILTER" \
          --jobs 4 \
          --timeout 30 \
          --output target/issue-59-mutants \
          --caught \
          --unviable \
          -- \
          -- \
          --skip issue_62 \
          --skip issue_64 \
          --skip issue_66
    - name: Reject missing, incomplete, surviving, or timed-out mutations
      run: >-
        python3 scripts/check_mutation_report.py
        target/issue-59-mutants/mutants.out/outcomes.json
    - name: Upload mutation evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: issue-59-blocker-mutations
        path: target/issue-59-mutants/mutants.out
        if-no-files-found: error

  performance-baseline:
    name: Release performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: "1.97.1"
    - name: Build the optimized binary
      run: cargo build --release --locked
    - name: Run fixed fixtures and compare the versioned baseline
      run: >-
        python3 scripts/run_performance_baseline.py
        --output target/issue-59-performance.json
        --reference benchmarks/issue-59-baseline.json
    - name: Upload performance evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: issue-59-performance
        path: target/issue-59-performance.json
        if-no-files-found: error

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - name: Install checksum-pinned actionlint 1.7.12
      env:
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        ACTIONLINT_VERSION: 1.7.12
      run: |
        archive="$RUNNER_TEMP/actionlint.tar.gz"
        curl --fail --location --silent --show-error \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          --output "$archive"
        echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check -
        tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Install checksum-pinned zizmor 1.25.2
      env:
        ZIZMOR_SHA256: aa1facd105f0d83fe5c55b1adcd9d7417de5d83aa27471f91dc0b66cf3803577
        ZIZMOR_VERSION: 1.25.2
      run: |
        archive="$RUNNER_TEMP/zizmor.tar.gz"
        curl --fail --location --silent --show-error \
          "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$archive"
        echo "$ZIZMOR_SHA256  $archive" | sha256sum --check -
        tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Install checksum-pinned README documentation tools
      env:
        LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        LYCHEE_VERSION: 0.24.2
        RUMDL_SHA256: 01e0dd2d89c07d244c5c93243f7faf2986d2abec68a7cec458e38c25988fbabc
        RUMDL_VERSION: 0.2.43
      run: |
        lychee_archive="$RUNNER_TEMP/lychee.tar.gz"
        curl --fail --location --silent --show-error \
          "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$lychee_archive"
        echo "$LYCHEE_SHA256  $lychee_archive" | sha256sum --check -
        tar -xzf "$lychee_archive" -C "$RUNNER_TEMP" \
          --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee

        rumdl_archive="$RUNNER_TEMP/rumdl.tar.gz"
        curl --fail --location --silent --show-error \
          "https://github.com/rvben/rumdl/releases/download/v${RUMDL_VERSION}/rumdl-v${RUMDL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$rumdl_archive"
        echo "$RUMDL_SHA256  $rumdl_archive" | sha256sum --check -
        tar -xzf "$rumdl_archive" -C "$RUNNER_TEMP" rumdl
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Lint GitHub Actions workflows
      run: actionlint .github/workflows/*.yml .github/examples/*.yml
    - name: Audit GitHub Actions workflows
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --pedantic --no-ignores .github/workflows/ .github/examples/readme-verify.yml
    - name: Lint README Markdown
      run: rumdl check --disable MD010,MD013,MD038 README.md
    - name: Check README links
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: lychee --no-progress README.md .github/examples/readme-verify.yml

  issue-selector:
    name: Production-readiness issue selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: just@1.51.0
    - name: Check Just recipes
      run: just --fmt --check
    - name: Compile selector
      run: python3 -m py_compile scripts/get_next_production_readiness_issue.py
    - name: Run selector tests
      run: just test-production-readiness-selector

  release-identity:
    name: Prepared release identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Run release-identity checker regressions
      run: >-
        PYTHONDONTWRITEBYTECODE=1 python3 -m unittest
        tests/test_check_release_identity.py -v
    - name: Assert prepared version and external tag input
      run: python3 scripts/check_release_identity.py --tag v0.2.0
    - name: Prove published baseline and exact packaged install identity
      run: cargo test --locked --test issue_64_release_identity -- --nocapture
    - name: Assert the package allowlist
      run: >-
        cargo test --locked --test issue_62_package_boundary
        issue_62_package_manifest_is_the_exact_reviewed_allowlist
        -- --exact --nocapture
    - name: Smoke-test the exact packaged CLI
      run: >-
        cargo test --locked --test issue_62_package_boundary
        issue_62_exact_package_installs_smokes_and_rejects_library_consumers
        -- --exact --ignored --nocapture
    - name: Require clean package source
      run: git diff --exit-code
    - name: Build the prepared package without publishing
      run: cargo package --locked
    - name: Dry-run the prepared package publication
      run: cargo publish --dry-run --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -- --check

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - name: Build
      run: cargo build --locked --verbose
    - name: Build release
      run: cargo build --release --locked --verbose
    - name: Run README examples on every supported shell platform
      run: cargo test --locked --test issue_66_readme_examples -- --nocapture
    - name: Run hermetic test-infrastructure contract
      run: cargo test --locked --test issue_58_test_hermeticity -- --nocapture
    - name: Run focused entry-type tests
      run: cargo test --locked issue_42 -- --nocapture
    - name: Run focused generation-preflight tests
      run: cargo test --locked issue_43 -- --nocapture
    - name: Run focused generation-preflight tests in release mode
      run: cargo test --release --locked issue_43 -- --nocapture
    - name: Run focused exclusion tests
      run: cargo test --locked issue_44 -- --nocapture
    - name: Run focused environment-precedence tests
      run: cargo test --locked issue_46 -- --nocapture
    - name: Run focused filesystem-identity tests
      run: cargo test --locked issue_50 -- --nocapture
    - name: Run focused filesystem-identity tests in release mode
      run: cargo test --release --locked issue_50 -- --nocapture
    - name: Run focused containment-guarantee tests
      run: cargo test --locked issue_51 -- --nocapture
    - name: Run focused containment-guarantee tests in release mode
      run: cargo test --release --locked issue_51 -- --nocapture
    - name: Run focused historical full-path disposition tests
      run: cargo test --bin agentic-navigation-guide --locked issue_52 -- --nocapture
    - name: Run focused historical symlink-model disposition tests
      run: cargo test --bin agentic-navigation-guide --locked issue_53 -- --nocapture
    - name: Run focused binary-only surface tests
      run: cargo test --bin agentic-navigation-guide --locked issue_54 -- --nocapture
    - name: Prove the packaged target surface is binary-only
      run: cargo test --test issue_54_binary_only_package --locked -- --nocapture
    - name: Run binding all-owner guide contract
      env:
        GUIDE_FORMAT_REQUIRE_CONFORMANCE: all
      run: >-
        cargo test --bin agentic-navigation-guide --locked
        v0_2_contract_tests:: -- --nocapture
    - name: Run focused Windows guide namespace precedence tests
      if: runner.os == 'Windows'
      run: cargo test --locked issue_102 -- --nocapture
    - name: Run focused logical-backslash regression
      run: cargo test --locked issue_27 -- --nocapture
    - name: Run focused syntax-sensitive-name tests
      run: cargo test --locked issue_41 -- --nocapture
    - name: Run ill-formed Windows-name diagnostic test
      if: runner.os == 'Windows'
      run: cargo test --locked path_codec::tests::ill_formed_windows_name_diagnostic_preserves_every_utf16_unit -- --exact --nocapture

  third-party-licenses:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: cargo-about@0.9.0
    - name: Regenerate THIRD_PARTY_LICENSES.md
      run: cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md
    - name: Verify THIRD_PARTY_LICENSES.md is up to date
      run: |
        if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
          echo "::error file=THIRD_PARTY_LICENSES.md::THIRD_PARTY_LICENSES.md is out of date. Run \`cargo licenses\` (or \`cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md\`) locally and commit the result."
          exit 1
        fi
