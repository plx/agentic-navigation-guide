name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Third-party actions are pinned to immutable commit SHAs (with the version
# tag in a trailing comment) so a compromised upstream tag cannot silently
# swap in malicious code. Bump SHAs intentionally when upgrading.
jobs:
  rust-support:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - rust: "1.85.0"
          msrv: true
          lint: true
        - rust: "1.96.1"
          msrv: false
          lint: false
        - rust: "1.97.1"
          msrv: false
          lint: true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: ${{ matrix.rust }}
        components: clippy
    - name: Check every target and feature
      run: cargo check --locked --all-targets --all-features
    - name: Test every target and feature
      run: cargo test --locked --all-targets --all-features
    - name: Lint supported endpoints
      if: matrix.lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Package on the MSRV
      if: matrix.msrv
      run: cargo package --locked
    - name: Install the packaged CLI on the MSRV
      if: matrix.msrv
      run: cargo install --path . --locked --root "$RUNNER_TEMP/msrv-install"

  rust-beta:
    name: Rust beta (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        toolchain: beta
    - name: Check the next Rust toolchain
      run: cargo check --locked --all-targets --all-features
    - name: Test the next Rust toolchain
      run: cargo test --locked --all-targets --all-features

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: actionlint@1.7.12
    - name: Lint GitHub Actions workflows
      run: actionlint .github/workflows/*.yml

  issue-selector:
    name: Production-readiness issue selector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: just@1.51.0
    - name: Check Just recipes
      run: just --fmt --check
    - name: Compile selector
      run: python3 -m py_compile scripts/get_next_production_readiness_issue.py
    - name: Run selector tests
      run: just test-production-readiness-selector

  release-identity:
    name: Prepared release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Run release-identity checker regressions
      run: >-
        PYTHONDONTWRITEBYTECODE=1 python3 -m unittest
        tests/test_check_release_identity.py -v
    - name: Assert prepared version and external tag input
      run: python3 scripts/check_release_identity.py --tag v0.2.0
    - name: Prove published baseline and exact packaged install identity
      run: cargo test --locked --test issue_64_release_identity -- --nocapture
    - name: Require clean package source
      run: git diff --exit-code
    - name: Build the prepared package without publishing
      run: cargo package --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -- --check

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - name: Build
      run: cargo build --verbose
    - name: Build release
      run: cargo build --release --verbose
    - name: Run focused entry-type tests
      run: cargo test --locked issue_42 -- --nocapture
    - name: Run focused generation-preflight tests
      run: cargo test --locked issue_43 -- --nocapture
    - name: Run focused generation-preflight tests in release mode
      run: cargo test --release --locked issue_43 -- --nocapture
    - name: Run focused exclusion tests
      run: cargo test --locked issue_44 -- --nocapture
    - name: Run focused environment-precedence tests
      run: cargo test --locked issue_46 -- --nocapture
    - name: Run focused filesystem-identity tests
      run: cargo test --locked issue_50 -- --nocapture
    - name: Run focused filesystem-identity tests in release mode
      run: cargo test --release --locked issue_50 -- --nocapture
    - name: Run focused containment-guarantee tests
      run: cargo test --locked issue_51 -- --nocapture
    - name: Run focused containment-guarantee tests in release mode
      run: cargo test --release --locked issue_51 -- --nocapture
    - name: Run focused historical full-path disposition tests
      run: cargo test --bin agentic-navigation-guide --locked issue_52 -- --nocapture
    - name: Run focused historical symlink-model disposition tests
      run: cargo test --bin agentic-navigation-guide --locked issue_53 -- --nocapture
    - name: Run focused binary-only surface tests
      run: cargo test --bin agentic-navigation-guide --locked issue_54 -- --nocapture
    - name: Prove the packaged target surface is binary-only
      run: cargo test --test issue_54_binary_only_package --locked -- --nocapture
    - name: Run binding all-owner guide contract
      env:
        GUIDE_FORMAT_REQUIRE_CONFORMANCE: all
      run: >-
        cargo test --bin agentic-navigation-guide --locked
        v0_2_contract_tests:: -- --nocapture
    - name: Run focused logical-backslash regression
      run: cargo test --locked issue_27 -- --nocapture
    - name: Run focused syntax-sensitive-name tests
      run: cargo test --locked issue_41 -- --nocapture
    - name: Run ill-formed Windows-name diagnostic test
      if: runner.os == 'Windows'
      run: cargo test --locked path_codec::tests::ill_formed_windows_name_diagnostic_preserves_every_utf16_unit -- --exact --nocapture

  third-party-licenses:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
    - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1.16.1
    - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8  # v2.77.6
      with:
        tool: cargo-about@0.9.0
    - name: Regenerate THIRD_PARTY_LICENSES.md
      run: cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md
    - name: Verify THIRD_PARTY_LICENSES.md is up to date
      run: |
        if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
          echo "::error file=THIRD_PARTY_LICENSES.md::THIRD_PARTY_LICENSES.md is out of date. Run \`cargo licenses\` (or \`cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md\`) locally and commit the result."
          exit 1
        fi
