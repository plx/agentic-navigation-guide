name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Run tests
      run: cargo test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy
    - name: Run clippy
      run: cargo clippy -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Build
      run: cargo build --verbose
    - name: Build release
      run: cargo build --release --verbose

  third-party-licenses:
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-about@0.9.0
    - name: Regenerate THIRD_PARTY_LICENSES.md
      run: cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md
    - name: Verify THIRD_PARTY_LICENSES.md is up to date
      run: |
        if ! git diff --exit-code -- THIRD_PARTY_LICENSES.md; then
          echo "::error file=THIRD_PARTY_LICENSES.md::THIRD_PARTY_LICENSES.md is out of date. Run \`cargo licenses\` (or \`cargo about generate about.hbs --output-file THIRD_PARTY_LICENSES.md\`) locally and commit the result."
          exit 1
        fi