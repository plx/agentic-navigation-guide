name: Issue 65 invalid release environment probe

on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: issue-65-invalid-release-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  invalid-ref:
    name: Reject a pull-request ref at the release environment
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fail if an invalid ref reaches a runner
      run: |
        echo "::error::the release environment admitted a pull-request ref"
        exit 1
