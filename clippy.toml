# Additional Clippy lints configuration
# This file works alongside .clippy.toml for more detailed configuration

# Warn on common mistakes and enforce good practices
warn = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::nursery",
    "clippy::cargo",
]

# Allow certain lints that are too strict for this project
allow = [
    "clippy::module_name_repetitions",
    "clippy::must_use_candidate",
    "clippy::missing_errors_doc",
    "clippy::missing_panics_doc",
    "clippy::cargo_common_metadata",
]